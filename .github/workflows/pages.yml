name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "python/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-desktop:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            package: Chromebook-Linux
          - os: windows-latest
            package: Windows
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packaging dependencies
        run: python -m pip install -r python/requirements-package.txt

      - name: Build Windows executable
        if: runner.os == 'Windows'
        working-directory: python
        run: pyinstaller --noconfirm --clean --onefile --windowed --name CrisCyborgBoxing89 --collect-all pygame launcher.py

      - name: Build Chromebook Linux executable
        if: runner.os == 'Linux'
        working-directory: python
        run: pyinstaller --noconfirm --clean --onefile --name CrisCyborgBoxing89 --collect-all pygame launcher.py

      - name: Archive Windows build
        if: runner.os == 'Windows'
        run: Compress-Archive -Path python/dist/CrisCyborgBoxing89.exe -DestinationPath CrisCyborgBoxing89-Windows.zip

      - name: Archive Chromebook Linux build
        if: runner.os == 'Linux'
        run: tar -czf CrisCyborgBoxing89-Chromebook-Linux.tar.gz -C python/dist CrisCyborgBoxing89

      - name: Upload desktop build
        uses: actions/upload-artifact@v4
        with:
          name: CrisCyborgBoxing89-${{ matrix.package }}
          path: CrisCyborgBoxing89-${{ matrix.package }}.*
          if-no-files-found: error

  deploy:
    needs: build-desktop
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Windows build
        uses: actions/download-artifact@v4
        with:
          name: CrisCyborgBoxing89-Windows
          path: docs/downloads

      - name: Download Chromebook Linux build
        uses: actions/download-artifact@v4
        with:
          name: CrisCyborgBoxing89-Chromebook-Linux
          path: docs/downloads

      - name: Package Python game download
        run: |
          mkdir -p docs/downloads
          git archive --format=zip --prefix=CrisCyborgBoxing89/ HEAD python \
            -o docs/downloads/CrisCyborgBoxing89.zip

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
